revision:
  request: >-
    Integrate Anna among wider RafeOS nudges, bring everyday assistance into a
    recognisable AI-assistant interface, align the source markers, add other
    future API uses, improve the sketch information and phone treatment, and
    add a separate as-if-built native product board.
  preserve:
    - Draft 1 editable sources, PNGs, ink layer and original archive.
    - The proposition, two principal outcomes, fictional Anna example and trust boundaries.
    - The richer review as the primary feedback target.
  change:
    - Mixed Cockpit briefing with people alongside task, messaging, travel and home items.
    - Codex-style everyday-assistance mock-up with sidebar, task, source activity and composer.
    - Aligned source markers and a third open API branch for other uses to explore.
    - Product-led proposition composition and monochrome phone copy.
    - A native preview board plus standalone Cockpit, Codex and WhatsApp mock-ups.
  accepted_decisions:
    - People is part of the wider RafeOS briefing.
    - Scoped access supports multiple use cases as well as multiple surfaces.
    - Native product contexts make the integration more tangible.
  introduced_in_draft_2:
    - 03-product-storyboard/03-native-product-preview-editable.svg
    - assets/native/cockpit.svg
    - assets/native/codex.svg
    - assets/native/whatsapp.svg
  illustrative_detail:
    - Sam is a separate wholly fictional contact used only in the WhatsApp birthday example.
    - The native board contains different moments rather than simultaneous state.

example_run:
  mode: iterated
  source_prompt: input.md
  human_feedback_rounds: 2
  agent_qa: >-
    Rendered and visually inspected every board, ran the pack checker, verified
    the six-page PDF, and imported the final boards and standalone surfaces into
    Figma to check editability and destination limitations.
